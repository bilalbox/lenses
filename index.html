<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lenses explores Quranic Arabic word by word: morphology, dependency syntax, and classical iʿrāb."
    />
    <meta name="theme-color" content="#0f6e66" />
    <title>عدسات — Lenses</title>
    <script>
      (() => {
        const storedTheme = localStorage.getItem("lenses-theme") || localStorage.getItem("bayan-theme");
        const theme =
          storedTheme ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = theme;
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", theme === "dark" ? "#101311" : "#0f6e66");
        }

        const storedLang = localStorage.getItem("lenses-lang");
        let lang = storedLang;
        if (!lang || (lang !== "en" && lang !== "ar" && lang !== "id")) {
          const nav = navigator.languages?.[0] || navigator.language || "";
          const prefix = nav.toLowerCase().split("-")[0];
          if (prefix === "ar") lang = "ar";
          else if (prefix === "id" || prefix === "in") lang = "id";
          else lang = "en";
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
